name: Validate

on:
  push:
  pull_request:
  schedule:
    # HACS/hassfest requirements drift; catch breakage without a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # This domain is not in home-assistant/brands (the integration ships
          # its own artwork, see README), and this is a custom repository
          # rather than a HACS default one.
          ignore: brands
